<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Detail — NovaStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-lg sticky-top neon-nav">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <span class="brand-glow">NOVA</span><span class="brand-dot">.</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mx-auto gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link active" href="product-detail.html?product=0">Featured</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="cart.html" class="nav-link position-relative">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-neon" id="cartCount">0</span>
                    </a>
                    <a href="checkout.html" class="btn btn-neon-outline btn-sm px-3">Checkout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <main class="py-5">
        <div class="container">
            <div id="productDetailContainer">
                <!-- populated by JS -->
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer pt-5 pb-3 mt-5 border-top border-neon-subtle">
        <div class="container">
            <div class="row">
                <div class="col text-center text-secondary-glow small">
                    &copy; 2026 <span class="text-white">NOVA</span>. Built for the future.
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
        (function() {
            const container = document.getElementById('productDetailContainer');
            const params = new URLSearchParams(window.location.search);
            const productId = parseInt(params.get('product')) || 0;

            const product = window.PRODUCTS.find(p => p.id === productId);
            if (!product) {
                container.innerHTML = `<div class="text-center text-secondary-glow py-5"><h3>Product not found</h3><a href="products.html" class="btn btn-neon mt-3">Browse Products</a></div>`;
                return;
            }

            container.innerHTML = `
                <div class="row g-5 align-items-start">
                    <div class="col-md-6">
                        <div class="card-glass p-3">
                            <img src="${product.image}" alt="${product.name}" class="img-fluid w-100 rounded-3" style="max-height:500px; object-fit:cover;" />
                        </div>
                    </div>
                    <div class="col-md-6">
                        <span class="badge bg-neon-soft mb-2">${product.category}</span>
                        <h1 class="fw-bold text-white display-5">${product.name}</h1>
                        <div class="d-flex align-items-center gap-2 mt-2">
                            <span class="text-warning fs-5">${'★'.repeat(Math.floor(product.rating))}${product.rating % 1 >= 0.5 ? '★' : ''}</span>
                            <span class="text-secondary-glow">(${product.reviews} reviews)</span>
                        </div>
                        <p class="text-secondary-glow mt-3" style="font-size:1.1rem;">${product.description || 'A premium product from NovaStore, engineered for performance and style.'}</p>
                        <div class="h2 fw-bold gradient-text mt-3">$${product.price}</div>
                        <div class="mt-4 d-flex gap-3">
                            <button class="btn btn-neon btn-lg px-5 add-to-cart" data-id="${product.id}">
                                <i class="bi bi-cart-plus me-2"></i> Add to Cart
                            </button>
                            <a href="products.html" class="btn btn-outline-neon btn-lg">Back to Products</a>
                        </div>
                        <div class="mt-4 text-secondary-glow small">
                            <i class="bi bi-truck me-1"></i> Free shipping
                            <span class="mx-2">|</span>
                            <i class="bi bi-arrow-repeat me-1"></i> 30-day returns
                        </div>
                    </div>
                </div>
            `;

            // Update badge
            if (window.updateCartBadge) window.updateCartBadge();

            // Add to cart
            document.addEventListener('click', function(e) {
                const btn = e.target.closest('.add-to-cart');
                if (btn) {
                    e.preventDefault();
                    const id = parseInt(btn.dataset.id);
                    if (window.addToCart && !isNaN(id)) {
                        window.addToCart(id);
                        if (window.updateCartBadge) window.updateCartBadge();
                        const orig = btn.innerHTML;
                        btn.innerHTML = '<i class="bi bi-check-lg"></i> Added!';
                        setTimeout(() => { btn.innerHTML = orig; }, 1500);
                    }
                }
            });

            window.addEventListener('cartUpdated', function() {
                if (window.updateCartBadge) window.updateCartBadge();
            });
        })();
    </script>
</body>
</html>
