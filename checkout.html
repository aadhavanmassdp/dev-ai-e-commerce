<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout — NovaStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-lg sticky-top neon-nav">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <span class="brand-glow">NOVA</span><span class="brand-dot">.</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mx-auto gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="product-detail.html?product=0">Featured</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="cart.html" class="nav-link position-relative">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-neon" id="cartCount">0</span>
                    </a>
                    <a href="checkout.html" class="btn btn-neon-outline btn-sm px-3 active">Checkout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <main class="py-5">
        <div class="container">
            <h2 class="fw-bold mb-4"><span class="gradient-text">Checkout</span></h2>
            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="card-glass p-4">
                        <h5 class="fw-bold text-white">Shipping Information</h5>
                        <form id="checkoutForm">
                            <div class="row g-3 mt-2">
                                <div class="col-md-6">
                                    <label class="text-secondary-glow small">First name</label>
                                    <input type="text" class="form-control bg-transparent border-neon" required />
                                </div>
                                <div class="col-md-6">
                                    <label class="text-secondary-glow small">Last name</label>
                                    <input type="text" class="form-control bg-transparent border-neon" required />
                                </div>
                                <div class="col-12">
                                    <label class="text-secondary-glow small">Email address</label>
                                    <input type="email" class="form-control bg-transparent border-neon" required />
                                </div>
                                <div class="col-12">
                                    <label class="text-secondary-glow small">Street address</label>
                                    <input type="text" class="form-control bg-transparent border-neon" required />
                                </div>
                                <div class="col-md-4">
                                    <label class="text-secondary-glow small">City</label>
                                    <input type="text" class="form-control bg-transparent border-neon" required />
                                </div>
                                <div class="col-md-4">
                                    <label class="text-secondary-glow small">State</label>
                                    <input type="text" class="form-control bg-transparent border-neon" required />
                                </div>
                                <div class="col-md-4">
                                    <label class="text-secondary-glow small">ZIP / Postal</label>
                                    <input type="text" class="form-control bg-transparent border-neon" required />
                                </div>
                            </div>
                            <hr class="border-neon-subtle my-4" />
                            <h5 class="fw-bold text-white">Payment</h5>
                            <div class="row g-3 mt-2">
                                <div class="col-12">
                                    <label class="text-secondary-glow small">Card number</label>
                                    <input type="text" class="form-control bg-transparent border-neon" placeholder="1234 5678 9012 3456" required />
                                </div>
                                <div class="col-md-4">
                                    <label class="text-secondary-glow small">Expiry</label>
                                    <input type="text" class="form-control bg-transparent border-neon" placeholder="MM/YY" required />
                                </div>
                                <div class="col-md-4">
                                    <label class="text-secondary-glow small">CVV</label>
                                    <input type="text" class="form-control bg-transparent border-neon" placeholder="123" required />
                                </div>
                            </div>
                            <button type="submit" class="btn btn-neon btn-lg w-100 mt-4">Place Order</button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="card-glass p-4 sticky-top" style="top:100px;">
                        <h5 class="fw-bold text-white">Order Summary</h5>
                        <div id="orderSummary" class="mt-3"></div>
                        <hr class="border-neon-subtle" />
                        <div class="d-flex justify-content-between fw-bold">
                            <span>Total</span>
                            <span class="gradient-text h5" id="orderTotal">$0.00</span>
                        </div>
                        <button type="submit" form="checkoutForm" class="btn btn-neon w-100 mt-3">Place Order</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer pt-5 pb-3 mt-5 border-top border-neon-subtle">
        <div class="container">
            <div class="row">
                <div class="col text-center text-secondary-glow small">
                    &copy; 2026 <span class="text-white">NOVA</span>. Built for the future.
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
        (function() {
            const summary = document.getElementById('orderSummary');
            const totalEl = document.getElementById('orderTotal');

            function renderSummary() {
                const cart = window.getCart ? window.getCart() : [];
                if (!cart || cart.length === 0) {
                    summary.innerHTML = `<p class="text-secondary-glow">Your cart is empty.</p>`;
                    totalEl.textContent = '$0.00';
                    return;
                }
                let html = '';
                let total = 0;
                cart.forEach(item => {
                    const product = window.PRODUCTS.find(p => p.id === item.id);
                    if (!product) return;
                    total += product.price * item.qty;
                    html += `
                        <div class="d-flex justify-content-between mb-2">
                            <span>${product.name} × ${item.qty}</span>
                            <span>$${(product.price * item.qty).toFixed(2)}</span>
                        </div>
                    `;
                });
                summary.innerHTML = html;
                totalEl.textContent = `$${total.toFixed(2)}`;
            }

            renderSummary();
            if (window.updateCartBadge) window.updateCartBadge();

            // Handle form submission
            document.getElementById('checkoutForm').addEventListener('submit', function(e) {
                e.preventDefault();
                alert('Thank you for your order! Your futuristic gear is on the way.');
                // Clear cart
                if (window.clearCart) window.clearCart();
                if (window.updateCartBadge) window.updateCartBadge();
                window.dispatchEvent(new Event('cartUpdated'));
                // Redirect to home
                window.location.href = 'index.html';
            });

            window.addEventListener('cartUpdated', function() {
                renderSummary();
                if (window.updateCartBadge) window.updateCartBadge();
            });
        })();
    </script>
</body>
</html>
