<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart — NovaStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-lg sticky-top neon-nav">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <span class="brand-glow">NOVA</span><span class="brand-dot">.</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mx-auto gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="product-detail.html?product=0">Featured</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="cart.html" class="nav-link position-relative">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-neon" id="cartCount">0</span>
                    </a>
                    <a href="checkout.html" class="btn btn-neon-outline btn-sm px-3">Checkout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <main class="py-5">
        <div class="container">
            <h2 class="fw-bold mb-4"><span class="gradient-text">Your</span> Cart</h2>
            <div id="cartContainer">
                <!-- populated by JS -->
            </div>
            <div class="mt-4 d-flex justify-content-between align-items-center">
                <a href="products.html" class="btn btn-outline-neon"><i class="bi bi-arrow-left me-2"></i>Continue Shopping</a>
                <a href="checkout.html" class="btn btn-neon btn-lg px-5" id="checkoutBtn">Proceed to Checkout</a>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer pt-5 pb-3 mt-5 border-top border-neon-subtle">
        <div class="container">
            <div class="row">
                <div class="col text-center text-secondary-glow small">
                    &copy; 2026 <span class="text-white">NOVA</span>. Built for the future.
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
        (function() {
            const container = document.getElementById('cartContainer');
            const checkoutBtn = document.getElementById('checkoutBtn');

            function renderCart() {
                const cart = window.getCart ? window.getCart() : [];
                if (!cart || cart.length === 0) {
                    container.innerHTML = `
                        <div class="text-center text-secondary-glow py-5">
                            <i class="bi bi-cart-x fs-1 d-block mb-3"></i>
                            <h4>Your cart is empty</h4>
                            <a href="products.html" class="btn btn-neon mt-3">Start Shopping</a>
                        </div>
                    `;
                    checkoutBtn.style.display = 'none';
                    return;
                }
                checkoutBtn.style.display = 'inline-block';

                let html = `<div class="table-responsive"><table class="table text-white align-middle">
                    <thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Total</th><th></th></tr></thead><tbody>`;
                let total = 0;
                cart.forEach(item => {
                    const product = window.PRODUCTS.find(p => p.id === item.id);
                    if (!product) return;
                    const subtotal = product.price * item.qty;
                    total += subtotal;
                    html += `
                        <tr>
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <img src="${product.image}" alt="${product.name}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;" />
                                    <div>
                                        <div class="fw-bold">${product.name}</div>
                                        <small class="text-secondary-glow">${product.category}</small>
                                    </div>
                                </div>
                            </td>
                            <td>$${product.price.toFixed(2)}</td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <button class="btn btn-outline-neon btn-sm qty-decrease" data-id="${item.id}">-</button>
                                    <span class="fw-bold">${item.qty}</span>
                                    <button class="btn btn-outline-neon btn-sm qty-increase" data-id="${item.id}">+</button>
                                </div>
                            </td>
                            <td>$${subtotal.toFixed(2)}</td>
                            <td><button class="btn btn-danger btn-sm remove-item" data-id="${item.id}"><i class="bi bi-trash"></i></button></td>
                        </tr>
                    `;
                });
                html += `</tbody><tfoot><tr><td colspan="3" class="text-end fw-bold">Total</td><td class="fw-bold gradient-text h4">$${total.toFixed(2)}</td><td></td></tr></tfoot></table></div>`;
                container.innerHTML = html;
            }

            // Event delegation for cart actions
            container.addEventListener('click', function(e) {
                const target = e.target.closest('button');
                if (!target) return;

                const id = parseInt(target.dataset.id);
                if (isNaN(id)) return;

                if (target.classList.contains('qty-increase')) {
                    window.updateCartItem(id, 1);
                } else if (target.classList.contains('qty-decrease')) {
                    window.updateCartItem(id, -1);
                } else if (target.classList.contains('remove-item')) {
                    window.removeFromCart(id);
                }
                renderCart();
                if (window.updateCartBadge) window.updateCartBadge();
                window.dispatchEvent(new Event('cartUpdated'));
            });

            // Initial render
            renderCart();
            if (window.updateCartBadge) window.updateCartBadge();

            window.addEventListener('cartUpdated', function() {
                renderCart();
                if (window.updateCartBadge) window.updateCartBadge();
            });
        })();
    </script>
</body>
</html>
